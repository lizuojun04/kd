name: Manual Trigger Workflow

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true

      - name: Build Linux amd64
        run: bash scripts/build.sh

      - name: Save Linux amd64 binary
        uses: actions/upload-artifact@v7
        with:
          name: kd_linux_amd64
          path: build/kd_linux_amd64
          if-no-files-found: error
          retention-days: 7
